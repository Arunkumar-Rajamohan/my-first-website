
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef4ff;
            padding: 60px 20px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 16px;
        }
        h1 { color: #2563eb; }
        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Website!</h1>
        <p>I'm learning how websites work.</p>
        <p>This is my very first website!</p>
        <button onclick="alert('It works!')">Click Me</button>
    </div>
</body>
</html>
